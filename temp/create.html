<!DOCTYPE html>
<html>
<title>Pinpoint</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<!-- Make sure you put this AFTER Leaflet's CSS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
    </script>
<link rel="stylesheet" href="style.css" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
</head>

<body>
    <header class="header">
        <img src="icon.svg" alt="icon" />

        <input id="dark" type="checkbox">
        <label id="toggle" for="dark">
            <div class="circle">
                <div class="semicircle"></div>
            </div>
        </label>
        <a href="">Login</a>
        <a>alle Anliegen</a>
    </header>
    <h2>Neues Anliegen</h2>
    <div id="map-container">
        <div id="map"></div>
        <script src="map.js"></script>
    </div>

    <section id="hero-section">
        <form method="post" enctype="multipart/form-data" action="" id="form">
            <label for="category" id="label_category">Category:</label>
            <select name="category" id="category">
                <option>1</option>
                <option>2</option>
            </select></br>
            <label for="description" id="label_description">Description:</label>
            <textarea name="description" id="description"> </textarea></br>
            <label for="email" id="label_email">Email: </label>
            <input type="email" name="email" id="email"></br>
            <label for="image" id="label_image">Image: </label>
            <input type="file" name="image" accept="image/*" id="image"></br>

            <input type="submit" id="submit"> </br>

            <label for="lat" id="label_lat">Latitude</label>
            <input type="number" name="lat" id="lat"> </br>
            <label for="lng" id="label_lng">Longitude</label>
            <input type="number" name="lng" id="lng">

        </form>

        <form id="nomi-form">
            <label for="address">Adresse: </label>
            <input type="type" name="adresse" id="address">
            <input type="submit">
        </from>
    </section>
    <script src="create.js"></script>

    <footer>
    </footer>



</body>


</html>
