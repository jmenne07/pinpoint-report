{% extends "geoentries/base.html" %}
{% load static %}
{% block stylesheets %}
{% endblock %}
{% block content %}
    <table>
        <tr>
            <th>Kategorie</th>
            <th>Anzahl</th>
        </tr>
        {% for cat in categories %}
            <tr>
                <th>{{ cat }}</th>
                <th>{{ cat.count }} </th>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
