{% extends "geoentries/base.html" %}
{% load static %}

{% block content %}
<h2>{{entry.title}}</h2>
<p>Description: {{entry.description}}</p>
{% if entry.image %}
<img src="{{ entry.image.url }}" alt="{{entry.name}}" style=" width:400px">
{% endif %}
<a href="{% url 'geoentries:index' %}">Zurück</a>

{% endblock %}
