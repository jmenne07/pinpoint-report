<!DOCTYPE html>
{% load static %}
<html>

<head>
    <title>{% block title %}Pinpoint-Geoentries{% endblock %}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>
    <link rel="stylesheet" href="{% static 'geoentries/base-style.css' %}" />
    {% block stylesheets %}
    {% endblock %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
</head>

<body>
    <header>
        <img src="{% static 'geoentries/icon.svg' %}" alt="Icon" />
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'geoentries:logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'geoentries:login' %}">login</a>
        {% endif %}
        <a href="{% url 'geoentries:list'%}">Alle Anliegen</a>
    </header>
    {% block content %}
    {% endblock %}
</body>

</html>
