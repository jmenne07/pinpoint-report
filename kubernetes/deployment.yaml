apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint
  template:
    metadata:
      labels:
        app: pinpoint
    spec:
      containers:
        - name: pinpoint
          image: pinpoint:latest # Local image name
          imagePullPolicy: Never # Prevents image pull errors
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "True"
          # Add more env vars (e.g., DATABASE_URL) as needed
